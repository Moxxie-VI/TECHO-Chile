{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ingresar · TECHO Chile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-11 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-3">
              <img src="{% static 'img/techo_logo.png' %}" height="42" alt="TECHO">
              <h1 class="h5 mt-2">Ingresar</h1>
            </div>
            {% if messages %}
              {% for m in messages %}
                <div class="alert alert-danger py-2">{{ m }}</div>
              {% endfor %}
            {% endif %}
            <form method="post" novalidate>
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Correo</label>
                <input name="correo" type="email" class="form-control" required aria-required="true">
              </div>
              <div class="mb-2">
                <label class="form-label">Contraseña</label>
                <input name="clave" type="password" class="form-control" required aria-required="true">
              </div>
              <button class="btn btn-primary w-100 mt-2">Entrar</button>
            </form>
            <div class="text-center mt-3">
              <a class="small" href="/">Volver al inicio</a>
            </div>
          </div>
        </div>
        <p class="text-center text-muted small mt-3">Acceso restringido a usuarios autorizados.</p>
      </div>
    </div>
  </div>
</body>
</html>
