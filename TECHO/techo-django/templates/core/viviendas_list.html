{% load static %}
<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viviendas · TECHO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4">Viviendas</h1>
    <a class="btn btn-outline-secondary" href="/dashboard/">Volver</a>
  </div>
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-primary">
        <tr><th>Proyecto</th><th>Tipo</th><th>Modelo</th><th>Cuartos</th><th>Baños</th></tr>
      </thead>
      <tbody>
      {% for v in viviendas %}
        <tr>
          <td>{{ v.proyecto.nombre }}</td>
          <td>{{ v.tipo }}</td>
          <td>{{ v.modelo }}</td>
          <td>{{ v.cant_cuartos }}</td>
          <td>{{ v.cant_banos }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="5" class="text-center text-muted">Sin registros</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
</body></html>
