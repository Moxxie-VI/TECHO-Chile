<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión - Plataforma Habitacional TECHO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f6fa;
      color: #1a1a1a;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.08);
      padding: 24px;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .title-area {
      text-align: center;
      margin-bottom: 16px;
    }

    .title-area h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
      color: #111827;
    }

    .title-area p {
      font-size: .8rem;
      color: #6b7280;
      margin: 4px 0 0;
      line-height: 1.4;
    }

    .msg-error {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      font-size: .8rem;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: .8rem;
      color: #374151;
      font-weight: 500;
      margin-bottom: 4px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      font-size: .9rem;
      line-height: 2.5rem;
      border-radius: 8px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      outline: none;
      transition: all .15s;
      background: #fff;
      color: #111827;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .forgot-link {
      font-size: .8rem;
      color: #2563eb;
      text-decoration: none;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      line-height: 2.75rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary:hover {
      background: #1e4fdc;
    }

    .divider {
      text-align: center;
      font-size: .7rem;
      color: #6b7280;
      margin: 16px 0;
    }

    .back-home {
      display: block;
      width: 100%;
      text-align: center;
      font-size: .8rem;
      color: #4b5563;
      text-decoration: none;
    }
    .back-home:hover {
      color: #111827;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="card">

    <div class="title-area">
      <h1>Inicia sesión</h1>
      <p>Plataforma Habitacional · TECHO Chile</p>
    </div>

    {% if messages %}
      {% for m in messages %}
        <div class="msg-error">{{ m }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="correo">Correo institucional / personal</label>
        <input
          type="email"
          id="correo"
          name="correo"
          placeholder="ej: ric.flores.ad@techochile.cl"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          required
        />
      </div>

      <div class="actions-row">
        <a class="forgot-link" href="#">¿Olvidaste tu contraseña?</a>
        <!-- más adelante esto va a ir a /password-reset/ -->
      </div>

      <button type="submit" class="btn-primary">Entrar</button>

    </form>

    <div class="divider">—</div>

    <a class="back-home" href="{% url 'landing' %}">← Volver al inicio público</a>

  </main>

</body>
</html>
